services:
  trendbot:
    build: .
    container_name: instagram-trend-whatsapp
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
